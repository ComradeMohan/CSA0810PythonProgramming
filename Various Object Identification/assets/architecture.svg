<svg width="1100" height="360" viewBox="0 0 1100 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root {
        --bg-1: #0a0e14;
        --bg-2: #0f172a;
        --grid: #1e293b;
        --text-heading: #f1f5f9;
        --text-muted: #94a3b8;
        --text-eyebrow: #2dd4bf;
        --text-footer: #5eead4;
        --accent-1: #2dd4bf;
        --node-bg: #0f172a;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-1: #f8fafc;
          --bg-2: #eef2f6;
          --grid: #dbe3ea;
          --text-heading: #0f172a;
          --text-muted: #475569;
          --text-eyebrow: #0d9488;
          --text-footer: #0d9488;
          --accent-1: #0d9488;
          --node-bg: #ffffff;
        }
      }
      .bg-fill { fill: var(--bg-1); }
      .grid-fill { stroke: var(--grid); }
      .node-bg { fill: var(--node-bg); }
      .node-stroke { stroke: var(--accent-1); }
      .edge { stroke: var(--accent-1); }
      .heading { fill: var(--text-heading); }
      .muted { fill: var(--text-muted); }
      .eyebrow { fill: var(--text-eyebrow); }
      .footer { fill: var(--text-footer); }
      .arrow-fill { fill: var(--accent-1); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" class="grid-fill" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1100" height="360" class="bg-fill"/>
  <rect width="1100" height="360" fill="url(#grid2)"/>

  <text x="30" y="36" font-family="JetBrains Mono, monospace" font-size="13" class="eyebrow" letter-spacing="2">PIPELINE</text>

  <!-- Node 1: Camera -->
  <g>
    <rect x="30" y="150" width="160" height="80" rx="12" class="node-bg node-stroke" stroke-width="1.5"/>
    <text x="110" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" class="heading">Webcam / Video</text>
    <text x="110" y="205" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" class="muted">cv2.VideoCapture</text>
  </g>

  <line x1="190" y1="190" x2="248" y2="190" class="edge" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 2: YOLOv8 -->
  <g>
    <rect x="250" y="140" width="180" height="100" rx="12" class="node-bg node-stroke" stroke-width="1.5"/>
    <text x="340" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" class="heading">YOLOv8 Model</text>
    <text x="340" y="198" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" class="muted">yolov8n.pt</text>
    <text x="340" y="216" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" class="muted">ultralytics inference</text>
  </g>

  <line x1="430" y1="190" x2="488" y2="190" class="edge" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 3: Post-process -->
  <g>
    <rect x="490" y="140" width="180" height="100" rx="12" class="node-bg node-stroke" stroke-width="1.5"/>
    <text x="580" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" class="heading">Post-process</text>
    <text x="580" y="192" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" class="muted">boxes · confidence</text>
    <text x="580" y="210" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" class="muted">cvzone overlay</text>
  </g>

  <line x1="670" y1="190" x2="728" y2="190" class="edge" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Branch: split to Desktop and Flask -->
  <g>
    <rect x="730" y="60" width="180" height="80" rx="12" class="node-bg node-stroke" stroke-width="1.5"/>
    <text x="820" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" class="heading">main.py</text>
    <text x="820" y="115" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" class="muted">cv2.imshow window</text>
  </g>

  <g>
    <rect x="730" y="220" width="180" height="80" rx="12" class="node-bg node-stroke" stroke-width="1.5"/>
    <text x="820" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" class="heading">Flask app.py</text>
    <text x="820" y="275" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" class="muted">MJPEG stream + API</text>
  </g>

  <path d="M700,190 Q715,190 715,150 Q715,100 728,100" fill="none" class="edge" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M700,190 Q715,190 715,230 Q715,260 728,260" fill="none" class="edge" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="910" y1="260" x2="968" y2="260" class="edge" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node: Browser -->
  <g>
    <rect x="970" y="220" width="100" height="80" rx="12" class="node-bg node-stroke" stroke-width="1.5"/>
    <text x="1020" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" class="heading">Browser</text>
    <text x="1020" y="273" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" class="muted">/video_feed</text>
  </g>

  <text x="30" y="340" font-family="JetBrains Mono, monospace" font-size="11" class="footer">frame in → detect → annotate → display / stream</text>
</svg>
